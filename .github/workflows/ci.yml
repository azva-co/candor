name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.37 matches go.mod's k8s.io/api version (the default make test would derive on its
        # own); 1.31 and 1.29 prove portability across older, still-supported cluster versions.
        envtest-k8s-version: ["1.37", "1.31", "1.29"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Staged, not run in full on every PR: 1.31/1.29 only prove portability, which changes far
      # less often than the code itself, so re-proving it on every push to a PR branch is mostly
      # paying twice for the same answer. Full three-version matrix still runs on every push to
      # main. Conditioned on the step, not the job (`if:` here, not on the job itself) - `test
      # (1.31)`/`test (1.29)` are required status checks by exact name (branch protection), and a
      # job this repeats reports success with all steps skipped just as well as one that actually
      # ran; a job-level skip risks a PR left waiting on a check GitHub never runs at all.
      - name: Build
        if: matrix.envtest-k8s-version == '1.37' || github.event_name != 'pull_request'
        run: make build

      - name: Test (envtest)
        if: matrix.envtest-k8s-version == '1.37' || github.event_name != 'pull_request'
        run: make test
        env:
          ENVTEST_K8S_VERSION: ${{ matrix.envtest-k8s-version }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check linter configuration
        run: make lint-config
      - name: Lint
        run: make lint

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # install_only: make test-e2e creates/tears down its own kind cluster (KIND_CLUSTER var),
      # matching local dev - this step just puts the kind CLI on PATH.
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true

      - name: E2E tests
        run: make test-e2e

  grafana-dashboard:
    runs-on: ubuntu-latest
    services:
      # Pinned to an exact version, not `latest` - same discipline as the envtest-k8s-version
      # matrix above. Grafana's own image is Alpine-based and ships both curl and wget, so the
      # health check below runs inside the service container without extra setup.
      grafana:
        image: grafana/grafana:12.2.0
        ports:
          - 3000:3000
        env:
          GF_SECURITY_ADMIN_PASSWORD: admin
        options: >-
          --health-cmd "curl -sf http://localhost:3000/api/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Grafana's dashboard-save API is lenient - it does NOT reject an invalid panel type or a
      # broken query, only structurally unimportable JSON (verified locally against a real
      # instance before writing this job). So this catches the file failing to parse, or the
      # import losing panels wholesale (e.g. someone truncates the file) - not query/panel-schema
      # correctness. A datasource is registered first so the dashboard's ${DS_PROMETHEUS}
      # datasource-template variable resolves during import.
      - name: Register a Prometheus datasource
        run: |
          curl -sf -u admin:admin -X POST http://localhost:3000/api/datasources \
            -H "Content-Type: application/json" \
            -d '{"name":"Prometheus","type":"prometheus","url":"http://localhost:9090","access":"proxy","isDefault":true}'

      - name: Import the dashboard into Grafana
        run: |
          python3 -c "
          import json
          d = json.load(open('charts/chart/files/grafana-dashboard.json'))
          print(json.dumps({'dashboard': d, 'overwrite': True}))
          " > /tmp/import-payload.json

          response=$(curl -sf -u admin:admin -X POST http://localhost:3000/api/dashboards/db \
            -H "Content-Type: application/json" \
            -d @/tmp/import-payload.json)
          echo "$response"

          import_status=$(echo "$response" | jq -r '.status')
          if [ "$import_status" != "success" ]; then
            echo "Grafana rejected the dashboard import"
            exit 1
          fi

      - name: Verify every panel round-tripped
        run: |
          got=$(curl -sf -u admin:admin http://localhost:3000/api/dashboards/uid/candor-overview | jq '.dashboard.panels | length')
          want=$(python3 -c "import json; print(len(json.load(open('charts/chart/files/grafana-dashboard.json'))['panels']))")
          if [ "$got" != "$want" ]; then
            echo "panel count mismatch after import: got $got, want $want"
            exit 1
          fi
