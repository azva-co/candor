name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    # SHA-pinned to azva-co/mkdocs-publisher's main, same discipline as every third-party
    # action in this repo (verified with `gh api repos/azva-co/mkdocs-publisher/commits/main`,
    # not guessed) - bump manually when that repo's workflow changes. Repo transferred from
    # teerakarna to azva-co 2026-09-29; this is the new owner, not a stale reference.
    uses: azva-co/mkdocs-publisher/.github/workflows/publish.yml@1f59e4759ee8e86a7e70e772b03508fe865b4a71 # main
    with:
      working-directory: docs-site
