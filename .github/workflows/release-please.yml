name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # Maintains a standing PR that bumps the version and CHANGELOG.md from Conventional Commits
      # since the last release, computed fresh each run - it does not read the hand-written prose
      # already in CHANGELOG.md. Merging that PR is a deliberate human decision, not automated
      # (unlike dependabot-automerge.yml): cutting a release is a "someone decided this was ready"
      # action, not something that should happen just because commits accumulated.
      #
      # This creates the tag AND a GitHub Release (skip-github-release was tried and reverted -
      # that flag skips tag creation too, there's no release-please path that tags without also
      # releasing). release.yml's goreleaser pipeline, triggered by the tag, then completely
      # replaces this release's body with its own (release.mode: replace in .goreleaser.yaml) -
      # binaries, cosign signing, SBOM, and the verification-instructions footer this project
      # actually wants on every release, none of which release-please's own body carries.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
