version: 2

# The container image is built, signed, and attested separately in
# .github/workflows/release.yml (same verified cosign + SBOM pattern as service-demo) - this file
# only handles the manager binary archives, checksums, changelog, and the GitHub Release itself.
builds:
  - id: manager
    main: ./cmd
    binary: manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: manager
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

# Keyless-signs checksums.txt (same Fulcio/Rekor-via-OIDC pattern as the image, no stored key) -
# every archive's hash is in there, so signing the one file covers all of them. Sigstore's current
# bundle format (verification material + signature + cert in one file), not the deprecated
# --output-signature/--output-certificate flags - verified against the installed cosign CLI's own
# --help before writing this, since those flags no longer exist in current cosign.
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  prerelease: auto
  # release-please now creates the GitHub Release first (it owns tagging - see
  # release-please-config.json's own comment), with its own terse, commit-derived notes and no
  # footer. The default mode (keep-existing) would then make this entire header/footer block below
  # dead: goreleaser discards its own freshly-built body outright whenever the existing release
  # already has non-empty notes (confirmed against goreleaser's own getReleaseNotes source, not
  # assumed from the docs alone - its wording undersells how total the replacement is). `replace`
  # keeps this release always carrying goreleaser's own changelog + verification instructions,
  # which is what actually matters here, not release-please's.
  mode: replace
  footer: |
    ## Container image and Helm chart

    ```
    ghcr.io/teerakarna/candor:{{ .Tag }}
    ```

    Signed with cosign (keyless, GitHub Actions OIDC) and carries a CycloneDX SBOM attestation.
    Verify with:

    ```
    cosign verify --certificate-identity-regexp "^https://github.com/teerakarna/candor/" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      ghcr.io/teerakarna/candor:{{ .Tag }}
    ```

    Helm chart: `oci://ghcr.io/teerakarna/charts/candor --version {{ .Version }}`

    ## Verifying the binaries

    `checksums.txt` is keyless-signed with cosign (same identity as the image above) - covers every
    archive in this release, since they're all hashed in that one file. Verify with:

    ```
    cosign verify-blob --bundle checksums.txt.bundle \
      --certificate-identity-regexp "^https://github.com/teerakarna/candor/" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    ```
